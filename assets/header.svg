<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Hesam Barzegar — Full-Stack Developer">
  <title>Hesam Barzegar — Full-Stack Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#121829"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" fill-opacity="0.18"/>
    </pattern>

    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="320" fill="url(#fade)"/>
    </mask>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

    <clipPath id="card">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .name {
      font: 800 76px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;
      letter-spacing: -1.5px;
    }
    .stroke {
      fill: none;
      stroke: url(#ink);
      stroke-width: 1.4;
      stroke-dasharray: 520;
      stroke-dashoffset: 520;
      animation: draw 2.4s cubic-bezier(.6,.1,.3,1) forwards;
    }
    .fill {
      fill: url(#ink);
      opacity: 0;
      animation: fadeIn 1s ease 1.6s forwards;
    }
    .role {
      font: 600 17px ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;
      letter-spacing: 7px;
      fill: #cbd5e1;
      opacity: 0;
      animation: rise .9s ease 2.2s forwards;
    }
    .chip text {
      font: 600 14px ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;
      fill: #e2e8f0;
    }
    .chip rect { fill: #ffffff; fill-opacity: .04; stroke: #ffffff; stroke-opacity: .12; }
    .chip { opacity: 0; animation: rise .7s ease forwards; }
    .c1 { animation-delay: 2.7s; }
    .c2 { animation-delay: 2.85s; }
    .c3 { animation-delay: 3.0s; }
    .c4 { animation-delay: 3.15s; }
    .dot { animation: pulse 2s ease-in-out infinite; }
    .caret { animation: blink 1s steps(1) infinite; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- drifting glow orbs -->
    <g filter="url(#blur)" opacity="0.55">
      <circle cx="220" cy="80" r="130" fill="#7c3aed">
        <animateTransform attributeName="transform" type="translate" values="0 0; 90 50; 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="250" r="140" fill="#0891b2">
        <animateTransform attributeName="transform" type="translate" values="0 0; -110 -40; 0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="40" r="90" fill="#db2777" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; -60 60; 0 0" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="320" fill="url(#dots)" mask="url(#gridMask)"/>

    <!-- status pill -->
    <g transform="translate(600 62)">
      <rect x="-118" y="-15" width="236" height="30" rx="15" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-opacity="0.35"/>
      <circle class="dot" cx="-96" cy="0" r="4.5" fill="#22c55e"/>
      <text x="8" y="5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="600" fill="#86efac">open to collaboration</text>
    </g>

    <!-- name: outline draws, then gradient fills in -->
    <text class="name stroke" x="600" y="160" text-anchor="middle">Hesam Barzegar</text>
    <text class="name fill" x="600" y="160" text-anchor="middle">Hesam Barzegar</text>

    <text class="role" x="600" y="204" text-anchor="middle">FULL-STACK DEVELOPER<tspan class="caret" fill="#22d3ee">_</tspan></text>

    <!-- stack chips -->
    <g transform="translate(357 238)"><g class="chip c1">
      <rect width="110" height="34" rx="10"/>
      <circle cx="18" cy="17" r="4" fill="#f87171"/>
      <text x="30" y="22">Laravel</text>
    </g></g>
    <g transform="translate(479 238)"><g class="chip c2">
      <rect width="120" height="34" rx="10"/>
      <circle cx="18" cy="17" r="4" fill="#fbbf24"/>
      <text x="30" y="22">Filament</text>
    </g></g>
    <g transform="translate(611 238)"><g class="chip c3">
      <rect width="120" height="34" rx="10"/>
      <circle cx="18" cy="17" r="4" fill="#60a5fa"/>
      <text x="30" y="22">WordPress</text>
    </g></g>
    <g transform="translate(743 238)"><g class="chip c4">
      <rect width="100" height="34" rx="10"/>
      <circle cx="18" cy="17" r="4" fill="#22d3ee"/>
      <text x="30" y="22">Go</text>
    </g></g>

    <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
</svg>
